name: Sincronizare meciuri

on:
  schedule:
    - cron: "*/15 * * * *"   # scoruri live (ambele surse): 1-2 request-uri cand nu se joaca nimic
    - cron: "5 21 * * *"     # program + inchidere meciuri de ieri: 00:05 ora Romaniei (vara). Dupa 25 oct: "5 22 * * *"
    - cron: "10 22 * * *"    # tabele: 01:10 ora Romaniei (vara), la 10 min dupa ora fixa ca sa nu se ciocneasca cu live. Dupa 25 oct: "10 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "live, upcoming sau standings"
        default: "upcoming"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizare football-data.org
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE=live
          if [ "$SCHEDULE" = "5 21 * * *" ]; then MODE=upcoming; fi
          if [ "$SCHEDULE" = "10 22 * * *" ]; then MODE=standings; fi
          if [ -n "$INPUT_MODE" ]; then MODE="$INPUT_MODE"; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/sync?mode=$MODE"
      - name: Sincronizare Highlightly (Liga 1/2, EL, ECL, Nations League)
        if: ${{ !cancelled() }}
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          MODE=live
          if [ "$SCHEDULE" = "5 21 * * *" ]; then MODE=upcoming; fi
          if [ "$SCHEDULE" = "10 22 * * *" ]; then MODE=standings; fi
          if [ -n "$INPUT_MODE" ]; then MODE="$INPUT_MODE"; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/sync-highlightly?mode=$MODE"
