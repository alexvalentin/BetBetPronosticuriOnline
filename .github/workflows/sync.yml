name: Sincronizare meciuri

on:
  schedule:
    # Live loop (3 starts per day, each job runs a loop of calls every 10 minutes, see the "live-loop" job).
    # The next job waits for the previous one (concurrency), so the slices chain with no gaps.
    - cron: "0 9 * * *"     # 12:00 Romania time (summer): loop until 16:30
    - cron: "0 13 * * *"    # 16:00: loop until 20:30 (starts when the previous one ends)
    - cron: "0 17 * * *"    # 20:00: loop until 01:00
    - cron: "5 22 * * *"    # schedule + closing yesterday's matches: 00:05 Romania time (winter, from 25 Oct; until then 01:05)
    - cron: "10 23 * * *"   # standings: 01:10 Romania time (winter, from 25 Oct; until then 02:10)
  workflow_dispatch:        # allows a manual run from the Actions tab
    inputs:
      mode:
        description: "live, upcoming sau standings"
        default: "upcoming"

jobs:
  # One-off runs: schedule, standings or a manual run
  sync:
    # Runs for a manual start or for the two daily schedules (not for the live loop starts).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '5 22 * * *' || github.event.schedule == '10 23 * * *' }}
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizare football-data.org
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Pick the mode from the schedule that started the job (default: live)
          MODE=live
          if [ "$SCHEDULE" = "5 22 * * *" ]; then MODE=upcoming; fi
          if [ "$SCHEDULE" = "10 23 * * *" ]; then MODE=standings; fi
          EXTRA=""
          # A manual run uses the typed mode and skips the 4-minute throttle (force=1)
          if [ -n "$INPUT_MODE" ]; then MODE="$INPUT_MODE"; EXTRA="&force=1"; fi
          # Call the site's cron endpoint, authenticated with the secret
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/sync?mode=$MODE$EXTRA"
      - name: Sincronizare Highlightly (Liga 1/2, EL, ECL, Nations League)
        if: ${{ !cancelled() }}   # runs even if the previous step failed
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Same mode selection as above, for the Highlightly endpoint
          MODE=live
          if [ "$SCHEDULE" = "5 22 * * *" ]; then MODE=upcoming; fi
          if [ "$SCHEDULE" = "10 23 * * *" ]; then MODE=standings; fi
          EXTRA=""
          if [ -n "$INPUT_MODE" ]; then MODE="$INPUT_MODE"; EXTRA="&force=1"; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/sync-highlightly?mode=$MODE$EXTRA"

  # A single job started by cron, which calls the live sync every 10 minutes until the end hour (Romania time)
  live-loop:
    # Only for the three live-loop schedules
    if: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 9 * * *' || github.event.schedule == '0 13 * * *' || github.event.schedule == '0 17 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: live-loop          # only one loop at a time; the next one waits
      cancel-in-progress: false
    steps:
      - name: Bucla live
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # End hour of the slice, depending on which schedule started it
          case "$SCHEDULE" in
            "0 9 * * *")  END_HM="16:30" ;;
            "0 13 * * *") END_HM="20:30" ;;
            *)            END_HM="01:00" ;;
          esac
          # Next occurrence of the end hour, in Romania time (also correct in winter time)
          now=$(date +%s)
          end=$(TZ=Europe/Bucharest date -d "$END_HM" +%s)
          if [ "$end" -le "$now" ]; then end=$((end + 86400)); fi
          # If the start was delayed so much that the end hour is more than 6 hours away, there is no point
          if [ $((end - now)) -gt 21600 ]; then echo "Pornire prea tarziu pentru aceasta felie, ies."; exit 0; fi
          echo "Bucla pana la $END_HM ora Romaniei ($((end - now)) secunde)"
          # Every 10 minutes call both live endpoints, until the end hour
          while [ "$(date +%s)" -lt "$end" ]; do
            curl -sS --max-time 55 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/sync?mode=live" || echo "football-data: eroare"
            echo
            curl -sS --max-time 55 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/sync-highlightly?mode=live" || echo "highlightly: eroare"
            echo
            sleep 600
          done
